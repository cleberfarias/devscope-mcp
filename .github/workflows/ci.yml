name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest

      - name: Verify server imports
        run: python -c "from devscope import server"

  auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp/auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest

  plugin-chatguru:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install devscope-auth (dependency, not yet published)
        working-directory: mcp/auth
        run: pip install -e ".[dev]"

      - name: Install plugin with dev dependencies
        working-directory: mcp/plugins/chatguru
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: mcp/plugins/chatguru
        run: ruff check .

      - name: Type check (mypy)
        working-directory: mcp/plugins/chatguru
        run: mypy

      - name: Test (pytest)
        working-directory: mcp/plugins/chatguru
        run: pytest

      - name: Verify plugin imports
        working-directory: mcp/plugins/chatguru
        run: python -c "from devscope_plugin_chatguru import server"
