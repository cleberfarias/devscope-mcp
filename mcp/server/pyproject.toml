[project]
name = "devscope-mcp"
version = "0.2.0"
description = "Project intelligence and diagnostics for AI coding agents via MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DevScope Contributors" }]
license = { text = "MIT" }
dependencies = [
  "mcp>=1.26,<2",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/cleberfarias/devscope-mcp"
Repository = "https://github.com/cleberfarias/devscope-mcp"
Issues = "https://github.com/cleberfarias/devscope-mcp/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
devscope = "devscope.cli:main"
devscope-mcp = "devscope.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devscope"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["devscope"]
